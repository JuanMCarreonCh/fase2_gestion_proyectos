[tool.poetry]
name = "calaverita-rag-api"
version = "0.1.0"
description = "RAG service for Día de Muertos calaveritas using LangGraph + FAISS + Ollama"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
langchain-ollama = "^0.2.0"
faiss-cpu = "^1.9.0"
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"          # requerido por TestClient de FastAPI
black = "^24.0.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
